<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">How prompt churn traps a codebase</title>
  <desc id="desc">A line graph. Architectural quality rises from prototype to initial success, then falls through growing coupling and prompt churn into codebase bankruptcy.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #253047; }
    .title { font-size: 25px; font-weight: 700; }
    .label { font-size: 16px; }
    .tick { font-size: 14px; fill: #5f6b7a; }
    .grid { stroke: #dfe3e8; stroke-width: 1; }
    .axis { stroke: #687386; stroke-width: 2; }
    .line { fill: none; stroke: #6c5ce7; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .point { fill: #6c5ce7; stroke: #ffffff; stroke-width: 4; }
    .callout { font-size: 15px; font-weight: 700; fill: #6c5ce7; }
    @media (prefers-color-scheme: dark) {
      text { fill: #eef2f7; }
      .tick { fill: #b5bfcc; }
      .grid { stroke: #3d4654; }
      .axis { stroke: #a4afbd; }
      .point { stroke: #1b1f27; }
    }
  </style>

  <text x="480" y="42" text-anchor="middle" class="title">How prompt churn traps a codebase</text>

  <line x1="100" y1="90" x2="100" y2="420" class="axis"/>
  <line x1="100" y1="420" x2="900" y2="420" class="axis"/>

  <line x1="100" y1="338" x2="900" y2="338" class="grid"/>
  <line x1="100" y1="255" x2="900" y2="255" class="grid"/>
  <line x1="100" y1="173" x2="900" y2="173" class="grid"/>
  <line x1="100" y1="90" x2="900" y2="90" class="grid"/>

  <text x="82" y="425" text-anchor="end" class="tick">0</text>
  <text x="82" y="343" text-anchor="end" class="tick">2.5</text>
  <text x="82" y="260" text-anchor="end" class="tick">5</text>
  <text x="82" y="178" text-anchor="end" class="tick">7.5</text>
  <text x="82" y="95" text-anchor="end" class="tick">10</text>

  <path d="M140 255 C205 220 255 125 320 140 S445 225 500 255 S620 315 680 338 S805 365 860 371" class="line"/>

  <circle cx="140" cy="255" r="8" class="point"/>
  <circle cx="320" cy="140" r="8" class="point"/>
  <circle cx="500" cy="255" r="8" class="point"/>
  <circle cx="680" cy="338" r="8" class="point"/>
  <circle cx="860" cy="371" r="8" class="point"/>

  <text x="320" y="112" text-anchor="middle" class="callout">Initial vibe success</text>
  <text x="735" y="316" text-anchor="middle" class="callout">Local-minimum trap</text>

  <text x="140" y="450" text-anchor="middle" class="tick">Prototype</text>
  <text x="320" y="450" text-anchor="middle" class="tick">Expansion</text>
  <text x="500" y="450" text-anchor="middle" class="tick">Coupling</text>
  <text x="680" y="450" text-anchor="middle" class="tick">Churn</text>
  <text x="860" y="450" text-anchor="middle" class="tick">Bankruptcy</text>

  <text x="500" y="495" text-anchor="middle" class="label">Context and code volume →</text>
  <text x="26" y="255" text-anchor="middle" class="label" transform="rotate(-90 26 255)">Architectural quality →</text>
</svg>
