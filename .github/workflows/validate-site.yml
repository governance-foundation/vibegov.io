name: Validate site

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build and validate all page heroes
        run: npm run build
      - name: Start built site
        run: |
          npm run serve:test > /tmp/vibegov-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vibegov-serve.log
          exit 1
      - name: Run site and responsive hero smoke tests
        run: npm run test:e2e
